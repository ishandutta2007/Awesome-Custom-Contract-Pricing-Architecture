<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .pulse-pill {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-50px, -30px) scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.7; }
      100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6)); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="110" r="130" fill="#0284c7" opacity="0.22" filter="url(#glow)" />
  <circle class="glow-orb-2" cx="980" cy="300" r="160" fill="#7c3aed" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="210" r="180" fill="#0d9488" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Flow Connections in Background -->
  <g opacity="0.45">
    <path class="flow-line" d="M 120 70 Q 350 20 600 70 T 1080 70" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-line" d="M 80 360 Q 400 395 620 350 T 1120 360" fill="none" stroke="#a855f7" stroke-width="1.8" />
    <path class="flow-line" d="M 150 210 C 300 130 900 130 1050 210" fill="none" stroke="#6366f1" stroke-width="1.4" />
  </g>

  <!-- Geometric Accent Borders / Accents -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Category Tag / Pill -->
  <g transform="translate(600, 75)">
    <rect class="pulse-pill" x="-155" y="-18" width="310" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-132" cy="0" r="5" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-118" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" letter-spacing="1.5">ENTERPRISE CPQ &amp; PRICING ARCHITECTURE</text>
  </g>

  <!-- Main Title (Strictly Foregrounded & Scaled) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Custom Contract &amp; Pricing Architecture
  </text>

  <!-- Subtitle (Clear, Readable) -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Configure-Price-Quote (CPQ) • Usage-Based Metering • Revenue Engines • Dynamic Contract Rules
  </text>

  <!-- Interactive Dynamic Component Pills (Bottom Row) -->
  <g transform="translate(180, 290)">
    <!-- Pill 1: CPQ Orchestration -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#0284c7" opacity="0.4" />
      <text x="26" y="30" text-anchor="middle" font-size="12" fill="#38bdf8">⚡</text>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">CPQ Engines</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">BOM &amp; Multi-Attributes</text>
    </g>

    <!-- Pill 2: Dynamic Rules -->
    <g transform="translate(215, 0)">
      <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#7c3aed" opacity="0.4" />
      <text x="26" y="30" text-anchor="middle" font-size="12" fill="#c084fc">📐</text>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Dynamic Rules</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Tiered, Ramped &amp; Matrix</text>
    </g>

    <!-- Pill 3: Metering & Invoicing -->
    <g transform="translate(435, 0)">
      <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#059669" opacity="0.4" />
      <text x="26" y="30" text-anchor="middle" font-size="12" fill="#34d399">📊</text>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Usage Metering</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Event Streams &amp; Rating</text>
    </g>

    <!-- Pill 4: Q2C Integration -->
    <g transform="translate(655, 0)">
      <rect x="0" y="0" width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#d97706" opacity="0.4" />
      <text x="26" y="30" text-anchor="middle" font-size="12" fill="#fbbf24">🔗</text>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Q2C Pipelines</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">ERP, Billing &amp; CRM Sync</text>
    </g>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
    CURATED SAAS PLATFORMS • OPEN-SOURCE BILLING ENGINES • ARCHITECTURAL PATTERNS
  </text>
</svg>
